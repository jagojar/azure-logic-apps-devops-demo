# Azure DevOps Pipeline for Logic App Standard Deployment
# This pipeline deploys the infrastructure and Logic App workflows

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - 'main.bicep'
      - 'main.bicepparam'
      - 'logic-app/**'

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Azure subscription service connection name (create in Azure DevOps Project Settings > Service connections)
  azureServiceConnection: 'Azure-Service-Connection'
  
  # Resource group and location
  resourceGroupName: 'logapps-devops-demo-rg'
  location: 'westus3'
  
  # Logic App name (should match the name generated by Bicep template)
  # Update this after first infrastructure deployment or use output from Bicep
  logicAppName: '$(namePrefix)-logicapp'
  
  # Name prefix for resources (should match main.bicepparam)
  namePrefix: 'logicapp-demo'

stages:
  # ============================================================================
  # Stage 1: Validate
  # ============================================================================
  - stage: Validate
    displayName: 'Validate Templates'
    jobs:
      - job: ValidateBicep
        displayName: 'Validate Bicep Template'
        steps:
          - task: AzureCLI@2
            displayName: 'Validate Bicep syntax'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Validating Bicep template..."
                az bicep build --file main.bicep
                echo "Bicep template is valid."

          - task: AzureCLI@2
            displayName: 'What-if deployment'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Running what-if deployment..."
                az deployment group what-if \
                  --resource-group $(resourceGroupName) \
                  --template-file main.bicep \
                  --parameters main.bicepparam \
                  || echo "Resource group may not exist yet, skipping what-if"

  # ============================================================================
  # Stage 2: Deploy Infrastructure
  # ============================================================================
  - stage: DeployInfrastructure
    displayName: 'Deploy Infrastructure'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: DeployBicep
        displayName: 'Deploy Bicep Template'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Create Resource Group'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo "Creating resource group $(resourceGroupName)..."
                      az group create \
                        --name $(resourceGroupName) \
                        --location $(location) \
                        --tags SecurityControl=Ignore SecurityContext=Ignore

                - task: AzureCLI@2
                  displayName: 'Deploy Bicep Template'
                  name: deployBicep
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo "Deploying infrastructure..."
                      
                      # Deploy and capture outputs
                      DEPLOYMENT_OUTPUT=$(az deployment group create \
                        --resource-group $(resourceGroupName) \
                        --template-file main.bicep \
                        --parameters main.bicepparam \
                        --query 'properties.outputs' \
                        --output json)
                      
                      # Extract Logic App name from deployment outputs
                      LOGIC_APP_NAME=$(echo $DEPLOYMENT_OUTPUT | jq -r '.logicAppName.value')
                      STORAGE_ACCOUNT_NAME=$(echo $DEPLOYMENT_OUTPUT | jq -r '.storageAccountName.value')
                      
                      echo "Logic App Name: $LOGIC_APP_NAME"
                      echo "Storage Account Name: $STORAGE_ACCOUNT_NAME"
                      
                      # Set pipeline variables for next stage
                      echo "##vso[task.setvariable variable=logicAppName;isOutput=true]$LOGIC_APP_NAME"
                      echo "##vso[task.setvariable variable=storageAccountName;isOutput=true]$STORAGE_ACCOUNT_NAME"
                      
                      echo "Infrastructure deployment completed successfully."

  # ============================================================================
  # Stage 3: Deploy Logic App Workflows
  # ============================================================================
  - stage: DeployWorkflows
    displayName: 'Deploy Logic App Workflows'
    dependsOn: DeployInfrastructure
    condition: succeeded()
    variables:
      logicAppNameFromBicep: $[ stageDependencies.DeployInfrastructure.DeployBicep.outputs['DeployBicep.deployBicep.logicAppName'] ]
    jobs:
      - deployment: DeployLogicAppWorkflows
        displayName: 'Deploy Workflows'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: ArchiveFiles@2
                  displayName: 'Create Logic App deployment package'
                  inputs:
                    rootFolderOrFile: '$(Build.SourcesDirectory)/logic-app'
                    includeRootFolder: false
                    archiveType: 'zip'
                    archiveFile: '$(Build.ArtifactStagingDirectory)/logic-app.zip'
                    replaceExistingArchive: true

                - task: AzureCLI@2
                  displayName: 'Deploy Logic App Workflows'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo "Deploying workflows to Logic App: $(logicAppNameFromBicep)"
                      
                      # Deploy using zip deploy
                      az webapp deploy \
                        --resource-group $(resourceGroupName) \
                        --name $(logicAppNameFromBicep) \
                        --src-path $(Build.ArtifactStagingDirectory)/logic-app.zip \
                        --type zip
                      
                      echo "Waiting for workflows to initialize..."
                      sleep 30
                      
                      echo "Workflow deployment completed successfully."

                - task: AzureCLI@2
                  displayName: 'Verify Workflow Health'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo "Checking workflow health..."
                      
                      # Get subscription ID
                      SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      
                      # List workflows and check health
                      WORKFLOWS=$(az rest --method get \
                        --uri "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$(resourceGroupName)/providers/Microsoft.Web/sites/$(logicAppNameFromBicep)/hostruntime/runtime/webhooks/workflow/api/management/workflows?api-version=2022-03-01")
                      
                      echo "Deployed workflows:"
                      echo "$WORKFLOWS" | jq -r '.[] | "  - \(.name): \(.health.state)"'
                      
                      # Check if any workflow is unhealthy
                      UNHEALTHY=$(echo "$WORKFLOWS" | jq '[.[] | select(.health.state != "Healthy")] | length')
                      
                      if [ "$UNHEALTHY" -gt 0 ]; then
                        echo "##vso[task.logissue type=warning]Some workflows are unhealthy. Check the Azure Portal for details."
                        echo "$WORKFLOWS" | jq '.[] | select(.health.state != "Healthy") | {name: .name, error: .health.errorMessage}'
                      else
                        echo "All workflows are healthy!"
                      fi

  # ============================================================================
  # Stage 4: Smoke Tests (Optional)
  # ============================================================================
  - stage: SmokeTests
    displayName: 'Smoke Tests'
    dependsOn: DeployWorkflows
    condition: succeeded()
    variables:
      logicAppNameFromBicep: $[ stageDependencies.DeployInfrastructure.DeployBicep.outputs['DeployBicep.deployBicep.logicAppName'] ]
    jobs:
      - job: TestWorkflows
        displayName: 'Test Deployed Workflows'
        steps:
          - task: AzureCLI@2
            displayName: 'Test HelloWorld Workflow'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Testing HelloWorld workflow..."
                
                SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                
                # Get callback URL
                CALLBACK_URL=$(az rest --method post \
                  --uri "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$(resourceGroupName)/providers/Microsoft.Web/sites/$(logicAppNameFromBicep)/hostruntime/runtime/webhooks/workflow/api/management/workflows/HelloWorld/triggers/When_a_HTTP_request_is_received/listCallbackUrl?api-version=2022-03-01" \
                  --query 'value' -o tsv)
                
                # Test the workflow
                RESPONSE=$(curl -s -X POST "$CALLBACK_URL" \
                  -H "Content-Type: application/json" \
                  -d '{"name": "Azure DevOps", "message": "Pipeline test"}')
                
                echo "Response: $RESPONSE"
                
                # Verify response
                SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
                if [ "$SUCCESS" = "true" ]; then
                  echo "HelloWorld workflow test passed!"
                else
                  echo "##vso[task.logissue type=error]HelloWorld workflow test failed!"
                  exit 1
                fi

          - task: AzureCLI@2
            displayName: 'Test ProcessOrder Workflow'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Testing ProcessOrder workflow..."
                
                SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                
                # Get callback URL
                CALLBACK_URL=$(az rest --method post \
                  --uri "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$(resourceGroupName)/providers/Microsoft.Web/sites/$(logicAppNameFromBicep)/hostruntime/runtime/webhooks/workflow/api/management/workflows/ProcessOrder/triggers/When_a_HTTP_request_is_received/listCallbackUrl?api-version=2022-03-01" \
                  --query 'value' -o tsv)
                
                # Test the workflow
                RESPONSE=$(curl -s -X POST "$CALLBACK_URL" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "orderId": "TEST-001",
                    "customerId": "PIPELINE-TEST",
                    "items": [
                      {"productId": "PROD-1", "quantity": 1, "unitPrice": 10.00}
                    ]
                  }')
                
                echo "Response: $RESPONSE"
                
                # Verify response
                SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
                ORDER_TOTAL=$(echo "$RESPONSE" | jq -r '.orderTotal')
                
                if [ "$SUCCESS" = "true" ] && [ "$ORDER_TOTAL" = "10" ]; then
                  echo "ProcessOrder workflow test passed!"
                else
                  echo "##vso[task.logissue type=error]ProcessOrder workflow test failed!"
                  exit 1
                fi
